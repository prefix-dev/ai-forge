context:
  version: b10217

recipe:
  name: llama-cpp
  version: ${{ version }}

source:
  url: https://github.com/ggml-org/llama.cpp/archive/refs/tags/${{ version }}.tar.gz
  sha256: 35ef06b4a0ad61c0865152fe0faa7e1f33c52627e71815621ae522c7e1eda0c2

outputs:
  - package:
      name: llama-cpp
    requirements:
      build:
        - ${{ compiler('c') }}
        - ${{ compiler('cxx') }}
        - cmake
        - ninja
      host:
        - openssl
    build:
      script: |
        cmake ${CMAKE_ARGS} -GNinja -S . -B build \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_INSTALL_PREFIX=${PREFIX} \
          -DLLAMA_BUILD_TESTS=OFF \
          -DLLAMA_BUILD_EXAMPLES=OFF \
          -DLLAMA_BUILD_SERVER=ON \
          -DLLAMA_OPENSSL=ON \
          -DGGML_METAL_EMBED_LIBRARY=ON
        cmake --build build --parallel ${CPU_COUNT}
        cmake --install build
    tests:
      - script:
          - llama-cli --version

  - package:
      name: llava-7b-q4
      version: "1.5"
    source:
      url: https://huggingface.co/jartine/llava-v1.5-7B-GGUF/resolve/main/llava-v1.5-7b-Q4_K.gguf?download=true
      sha256: c91ebf0a628ceb25e374df23ad966cc1bf1514b33fecf4f0073f9619dec5b3f9
      file_name: llava-v1.5-7b-Q4_K.gguf
    requirements:
      run:
        - llama-cpp
    build:
      noarch: generic
      script:
        - mkdir -p $PREFIX/share/llama-cpp/models
        - cp llava-v1.5-7b-Q4_K.gguf $PREFIX/share/llama-cpp/models/llava-v1.5-7b-Q4_K.gguf
