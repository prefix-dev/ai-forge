context:
  version: 1.9.1

recipe:
  name: whisper-cpp
  version: ${{ version }}

source:
  url: https://github.com/ggml-org/whisper.cpp/archive/refs/tags/v${{ version }}.tar.gz
  sha256: 147267177eef7b22ec3d2476dd514d1b12e160e176230b740e3d1bd600118447

outputs:
  - package:
      name: whisper-cpp
    requirements:
      build:
        - ${{ compiler('c') }}
        - ${{ compiler('cxx') }}
        - cmake
        - ninja
      host:
        - sdl2
    build:
      script: |
        cmake ${CMAKE_ARGS} -GNinja -S . -B build \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_INSTALL_PREFIX=${PREFIX} \
          -DWHISPER_BUILD_TESTS=OFF \
          -DWHISPER_BUILD_EXAMPLES=ON \
          -DWHISPER_BUILD_SERVER=ON \
          -DWHISPER_SDL2=ON \
          -DGGML_METAL_EMBED_LIBRARY=ON
        cmake --build build --parallel ${CPU_COUNT}
        cmake --install build
    tests:
      - script:
          - whisper-cli --help
          - whisper-stream --help

  - package:
      name: whisper-cpp-base-en
      version: 0.1.0
    source:
      url: https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-base.en.bin?download=true
      sha256: a03779c86df3323075f5e796cb2ce5029f00ec8869eee3fdfb897afe36c6d002
      file_name: ggml-base.en.bin
    requirements:
      run:
        - whisper-cpp
    build:
      noarch: generic
      script:
        - mkdir -p $PREFIX/share/models/whisper-cpp
        - cp ggml-base.en.bin $PREFIX/share/models/whisper-cpp/ggml-base.en.bin
