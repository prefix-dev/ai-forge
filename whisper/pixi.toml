[workspace]
name = "whisper"
channels = ["https://prefix.dev/ai-forge", "conda-forge"]
platforms = ["osx-arm64"]

[tasks]
start = "whisper-stream -m $CONDA_PREFIX/share/models/whisper-cpp/ggml-base.en.bin"
convert = { cmd = "ffmpeg -i {{ input }} -ar 16000 -ac 1 -c:a pcm_s16le output.wav", args = ["input"] }
transcribe = "whisper-cli -m $CONDA_PREFIX/share/models/whisper-cpp/ggml-base.en.bin"
download_example = "curl -o speech.wav https://upload.wikimedia.org/wikipedia/commons/7/75/Marshall_Plan_Speech.wav"

[dependencies]
whisper-cpp-base-en = "*"
ffmpeg = ">=8.0,<9"
whisper-cpp = ">=1.9.1,<2"
