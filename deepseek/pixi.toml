[workspace]
name = "deepseek"
version = "0.1.0"
description = "Run a quantized DeepSeek reasoning model locally with llama.cpp"
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64", "osx-64", "win-64"]

[tasks]
download = "python download_model.py"
start = { cmd = "python chat.py", depends-on = ["download"] }

[dependencies]
python = ">=3.11,<3.14"
"llama.cpp" = ">=10158"
huggingface_hub = ">=0.34,<2"
