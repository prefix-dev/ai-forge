[workspace]
name = "llama"
version = "0.1.0"
description = "Run a local LLaVA model with llama.cpp"
authors = ["Wolf Vollprecht <w.vollprecht@gmail.com>"]
channels = ["../output", "conda-forge"]
platforms = ["osx-arm64"]

[tasks]
start = "llama-cli -m $CONDA_PREFIX/share/llama-cpp/models/llava-v1.5-7b-Q4_K.gguf --conversation"

[dependencies]
"llama-cpp" = "*"
"llava-7b-q4" = "*"
